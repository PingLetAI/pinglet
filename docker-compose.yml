version: '3.9'
services:
  backend:
    build: ./backend
    container_name: linger-backend
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/linger
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-1209600}
      ADMIN_SECRET: ${ADMIN_SECRET:-admin-secret}
      APP_PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "npm run db:push && npm run seed && npm run start:dev"

  postgres:
    image: postgres:16-alpine
    container_name: linger-postgres
    environment:
      POSTGRES_DB: linger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: linger-redis
    ports:
      - '6379:6379'

volumes:
  postgres_data:
