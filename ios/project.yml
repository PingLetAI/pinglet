name: PingLet
options:
  bundleIdPrefix: ai.pinglet.app
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: 0.1.7
    CURRENT_PROJECT_VERSION: 8
    CODE_SIGN_STYLE: Automatic
targets:
  PingLet:
    type: application
    platform: iOS
    sources:
      - PingLet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pinglet.app
        PRODUCT_NAME: PingLet
        INFOPLIST_KEY_CFBundleDisplayName: PingLet
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_PingLetKeychainAccessGroup: $(AppIdentifierPrefix)ai.pinglet.shared
    entitlements:
      path: PingLet/PingLet.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.pinglet.app
        keychain-access-groups:
          - $(AppIdentifierPrefix)ai.pinglet.shared
    dependencies:
      - target: PingLetWidget
        embed: true
      - target: PingLetShare
        embed: true
  PingLetWidget:
    type: app-extension
    platform: iOS
    info:
      path: PingLetWidget/Info.plist
      properties:
        CFBundleDisplayName: PingLet
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - PingLetWidget
      - path: PingLet/Core/Models.swift
      - path: PingLet/Core/SharedStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pinglet.app.widget
    entitlements:
      path: PingLetWidget/PingLetWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.pinglet.app
  PingLetShare:
    type: app-extension
    platform: iOS
    info:
      path: PingLetShare/Info.plist
      properties:
        CFBundleDisplayName: PingLet
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text").@count > 0).@count > 0
    sources:
      - PingLetShare
      - path: PingLet/Core/Models.swift
      - path: PingLet/Core/SharedStore.swift
      - path: PingLet/Core/APIClient.swift
      - path: PingLet/Core/SecureStore.swift
      - path: PingLet/Core/SessionManager.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pinglet.app.share
        INFOPLIST_KEY_PingLetKeychainAccessGroup: $(AppIdentifierPrefix)ai.pinglet.shared
    entitlements:
      path: PingLetShare/PingLetShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.pinglet.app
        keychain-access-groups:
          - $(AppIdentifierPrefix)ai.pinglet.shared
