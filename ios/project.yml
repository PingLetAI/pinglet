name: PingLet
options:
  bundleIdPrefix: ai.pinglet.app
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: 0.1.7
    CURRENT_PROJECT_VERSION: 8
    CODE_SIGN_STYLE: Automatic
targets:
  PingLet:
    type: application
    platform: iOS
    sources:
      - PingLet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pinglet.app
        PRODUCT_NAME: PingLet
        INFOPLIST_KEY_CFBundleDisplayName: PingLet
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    entitlements:
      path: PingLet/PingLet.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.pinglet.app
    dependencies:
      - target: PingLetWidget
        embed: true
      - target: PingLetShare
        embed: true
  PingLetWidget:
    type: app-extension
    platform: iOS
    sources:
      - PingLetWidget
      - path: PingLet/Core/Models.swift
      - path: PingLet/Core/SharedStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pinglet.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: PingLet
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PingLetWidget/PingLetWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.pinglet.app
  PingLetShare:
    type: app-extension
    platform: iOS
    sources:
      - PingLetShare
      - path: PingLet/Core/Models.swift
      - path: PingLet/Core/SharedStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pinglet.app.share
        INFOPLIST_KEY_CFBundleDisplayName: PingLet
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.share-services
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
        INFOPLIST_KEY_NSExtension_NSExtensionAttributes_NSExtensionActivationRule: SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text").@count > 0).@count > 0
    entitlements:
      path: PingLetShare/PingLetShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.pinglet.app
