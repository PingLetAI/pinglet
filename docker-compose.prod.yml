services:
  backend:
    build: ./backend
    container_name: pinglet-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npm run prisma:deploy && node dist/main"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:$${APP_PORT:-3000}/api/v1/health/ready || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build: ./backend
    container_name: pinglet-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: node dist/worker
    healthcheck:
      test: ['CMD', 'node', '-e', 'const s=require("fs").statSync("/tmp/pinglet-worker-heartbeat");process.exit(Date.now()-s.mtimeMs<60000?0:1)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: pinglet-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pinglet_prod}
      POSTGRES_USER: ${POSTGRES_USER:-pinglet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pinglet} -d ${POSTGRES_DB:-pinglet_prod}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pinglet-redis
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
